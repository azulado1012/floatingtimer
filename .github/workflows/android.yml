name: Build Floating Timer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar componentes Android
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Encontrar e extrair projeto
        run: |
          mkdir -p extracted

          PROJECT_DIR=$(find . -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERRO: Não encontrei o projeto nem um arquivo ZIP."
              exit 1
            fi

            echo "Extraindo: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d extracted

            PROJECT_DIR=$(find extracted -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: Não encontrei settings.gradle no projeto."
            find . -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERRO: Módulo app não encontrado."
            find "$PROJECT_DIR" -maxdepth 3 -name "build.gradle*"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Corrigir compatibilidade Java e Kotlin
        run: |
          cat > "$RUNNER_TEMP/jvm-fix.gradle" <<'EOF'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.configureEach { task ->
                  if (task.class.name.contains("KotlinCompile")) {
                      task.kotlinOptions.jvmTarget = "17"
                  }
              }
          }
          EOF

          echo "Configuração de compatibilidade criada."

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK
        run: |
          gradle --no-daemon \
            --init-script "$RUNNER_TEMP/jvm-fix.gradle" \
            -p "$PROJECT_DIR" \
            assembleDebug

      - name: Verificar APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            find "$PROJECT_DIR" -name "*.apk"
            exit 1
          fi

          echo "APK gerado com sucesso!"
          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatingTimer-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
