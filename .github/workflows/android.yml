name: Build Floating Timer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate and extract project
        run: |
          mkdir -p extracted

          PROJECT_DIR=$(find . -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERRO: Nenhum projeto Gradle ou ZIP encontrado."
              exit 1
            fi

            unzip -q "$ZIP_FILE" -d extracted

            PROJECT_DIR=$(find extracted -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto: $PROJECT_DIR"

      - name: Fix Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          app = project / "app"

          files = [
              app / "build.gradle.kts",
              app / "build.gradle"
          ]

          gradle_file = next((p for p in files if p.exists()), None)

          if gradle_file is None:
              raise SystemExit("ERRO: app/build.gradle não encontrado.")

          content = gradle_file.read_text()

          # Altera a configuração Java 1.8 para Java 17.
          content = content.replace("VERSION_1_8", "VERSION_17")
          content = content.replace('sourceCompatibility = "1.8"', 'sourceCompatibility = "17"')
          content = content.replace('targetCompatibility = "1.8"', 'targetCompatibility = "17"')

          # Garante que exista uma configuração compileOptions.
          if "compileOptions" not in content:
              if gradle_file.suffix == ".kts":
                  block = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """
              else:
                  block = """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          """

              content = content.replace("android {", "android {\n" + block, 1)

          gradle_file.write_text(content)

          print("Arquivo ajustado:", gradle_file)
          print("Configuração compileOptions:")
          for line in content.splitlines():
              if "compileOptions" in line or "sourceCompatibility" in line or "targetCompatibility" in line or "jvmTarget" in line:
                  print(line.strip())
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            assembleDebug

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            find "$PROJECT_DIR" -name "*.apk"
            exit 1
          fi

          echo "APK gerado:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatingTimer-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
